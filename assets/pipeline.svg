<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#070B16"/><stop offset="1" stop-color="#0E1A33"/></linearGradient>
<linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0.000" stop-color="#7C3AED"/><stop offset="0.143" stop-color="#2563EB"/><stop offset="0.286" stop-color="#06B6D4"/><stop offset="0.429" stop-color="#22C55E"/><stop offset="0.571" stop-color="#EAB308"/><stop offset="0.714" stop-color="#F97316"/><stop offset="0.857" stop-color="#DC2626"/><stop offset="1.000" stop-color="#7F1D1D"/></linearGradient>

</defs>
<style>
.t{fill:#E6EDF3} .m{fill:#8B9BB4} .a{fill:#38BDF8}
.fade{opacity:0;animation:fade .8s ease forwards}
@keyframes fade{to{opacity:1}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.tw{animation:tw 3s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.9}}
.grow{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}

</style>
